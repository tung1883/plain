plugins {
    id("com.android.application")
    id("com.chaquo.python")
}

// Python for the Dev → Sandbox runner. Runs in its own process (see :sandbox_py in the manifest)
// so the app can kill a runaway script.
chaquopy {
    defaultConfig {
        version "3.12"
        buildPython "C:/Users/Tung/AppData/Local/Programs/Python/Python312/python.exe"
        pip {
            install "pyflakes==3.2.0"
        }
    }
}

android {
    namespace "com.plainphone.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.plainphone.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            // Bundled Stockfish binary (jniLibs/arm64-v8a/libstockfish.so) is arm64 only —
            // don't let the build claim ABIs we haven't compiled a copy for.
            abiFilters "arm64-v8a"
        }
    }

    // Stockfish must land on disk as a real executable file, not stay zipped inside the
    // APK the way an actual .so normally would — Process.exec() can't run a compressed
    // entry, and the packager only decompresses jniLibs when this is set.
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    // PMTiles does random byte-range reads into the archive (directory lookups, tile
    // fetches) — needs the asset stored uncompressed so AssetManager can seek it directly,
    // same reasoning as the jniLibs setting above for the Stockfish binary.
    androidResources {
        noCompress "pmtiles"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Plain JUnit: android.* stubs (Log, SystemClock) return defaults instead of throwing.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Offline map (nav plugin): renders local PMTiles archives, no network needed.
    implementation("org.maplibre.gl:android-sdk:13.6.1")

    // On-device translation for the keyboard's Translate panel (models download once per pair).
    implementation("com.google.mlkit:translate:17.0.3")
    implementation("com.google.mlkit:language-id:17.0.6")
    implementation("com.google.mlkit:entity-extraction:16.0.0-beta5")
    implementation("com.google.mlkit:digital-ink-recognition:18.1.0")
    implementation("com.google.mlkit:text-recognition:16.0.1")
    // Text of PDF files for the content search (their text layer only; scans are skipped).
    implementation("com.tom-roush:pdfbox-android:2.0.27.0")
    // Cuts the subject out of a sticker photo, background made transparent.
    implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")
    testImplementation("junit:junit:4.13.2")
    // Real org.json for JVM tests (android.jar only has stubs that return null).
    testImplementation("org.json:json:20231013")
    // XmlPullParser implementation for JVM tests of the document extractors (Android has its own).
    testImplementation("net.sf.kxml:kxml2:2.3.0")
}

// Stockfish binary isn't tracked in git (100MB) — fetch it from the GitHub release once,
// skip if already present so incremental builds don't re-download.
def stockfishSo = file("src/main/jniLibs/arm64-v8a/libstockfish.so")
tasks.register("fetchStockfish") {
    outputs.file(stockfishSo)
    onlyIf { !stockfishSo.exists() }
    doLast {
        stockfishSo.parentFile.mkdirs()
        new URL("https://github.com/tung1883/plain/releases/download/stockfish-android-arm64-v1/libstockfish.so")
            .withInputStream { i -> stockfishSo.withOutputStream { o -> o << i } }
    }
}
tasks.matching { it.name.startsWith("pre") && it.name.endsWith("Build") }.configureEach {
    dependsOn "fetchStockfish"
}

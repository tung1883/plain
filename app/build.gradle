plugins {
    id("com.android.application")
}

android {
    namespace "com.plainphone.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.plainphone.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            // Bundled Stockfish binary (jniLibs/arm64-v8a/libstockfish.so) is arm64 only —
            // don't let the build claim ABIs we haven't compiled a copy for.
            abiFilters "arm64-v8a"
        }
    }

    // Stockfish must land on disk as a real executable file, not stay zipped inside the
    // APK the way an actual .so normally would — Process.exec() can't run a compressed
    // entry, and the packager only decompresses jniLibs when this is set.
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
}

// Stockfish binary isn't tracked in git (100MB) — fetch it from the GitHub release once,
// skip if already present so incremental builds don't re-download.
def stockfishSo = file("src/main/jniLibs/arm64-v8a/libstockfish.so")
tasks.register("fetchStockfish") {
    outputs.file(stockfishSo)
    onlyIf { !stockfishSo.exists() }
    doLast {
        stockfishSo.parentFile.mkdirs()
        new URL("https://github.com/tung1883/plain/releases/download/stockfish-android-arm64-v1/libstockfish.so")
            .withInputStream { i -> stockfishSo.withOutputStream { o -> o << i } }
    }
}
tasks.matching { it.name.startsWith("pre") && it.name.endsWith("Build") }.configureEach {
    dependsOn "fetchStockfish"
}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
    body { margin: 0; }
    a { color: #cfcfcf; }
    a:hover { color: #ffffff; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #000000; color: #ffffff; font-family: 'IBM Plex Mono', 'Cascadia Mono', ui-monospace, Menlo, Consolas, monospace; display: flex; flex-direction: column;">

  <!-- search -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 24px;">
    <div style="flex-grow: 1; color: #7a7a7a; font-size: 15px; letter-spacing: 0.3px;">Search</div>
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.4">
      <circle cx="6.7" cy="6.7" r="4.5"></circle>
      <line x1="10.2" y1="10.2" x2="14" y2="14"></line>
    </svg>
  </div>

  <!-- TIPS STRIP (variant A — labelled kicker) -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 24px 20px 24px;">
    <div style="font-size: 10px; letter-spacing: 2.5px; color: #5c5c5c;">TIP OF THE DAY</div>
    <div style="font-size: 14px; line-height: 1.55; color: #9a9a9a;">Turn off recommended apps in your recent-apps screen.</div>
  </div>

  <!-- menu column + art -->
  <div style="display: flex; align-items: stretch; gap: 0; padding: 0 24px 0 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <div style="padding: 18px 24px; font-size: 19px; color: #ffffff;">Screen off</div>
      <div style="padding: 18px 24px; font-size: 19px; color: #ffffff;">Lock all</div>
      <div style="padding: 18px 24px; font-size: 19px; color: #ffffff;">Settings</div>
    </div>
    <div style="width: 118px; flex-shrink: 0; align-self: stretch; border: 3px solid #ffffff; background: #050505; overflow: hidden; display: flex; align-items: flex-end;">
      <svg width="112" height="150" viewBox="0 0 112 150" preserveAspectRatio="xMidYMax slice">
        <rect x="0" y="0" width="112" height="150" fill="#0a0a0a"></rect>
        <rect x="8" y="70" width="16" height="80" fill="#242424"></rect>
        <rect x="28" y="52" width="18" height="98" fill="#333333"></rect>
        <rect x="50" y="84" width="14" height="66" fill="#1e1e1e"></rect>
        <rect x="68" y="40" width="20" height="110" fill="#2b2b2b"></rect>
        <rect x="92" y="66" width="14" height="84" fill="#222222"></rect>
        <rect x="32" y="58" width="4" height="4" fill="#8a8a8a"></rect>
        <rect x="40" y="66" width="4" height="4" fill="#6a6a6a"></rect>
        <rect x="74" y="48" width="4" height="4" fill="#8a8a8a"></rect>
        <rect x="80" y="60" width="4" height="4" fill="#6a6a6a"></rect>
        <circle cx="90" cy="20" r="9" fill="#3a3a3a"></circle>
      </svg>
    </div>
  </div>

  <!-- divider -->
  <div style="height: 1px; background: #3f3f3f; margin: 14px 0 0 0;"></div>

  <!-- mode toggle -->
  <div style="display: flex; gap: 30px; padding: 18px 24px 14px 24px;">
    <div style="font-size: 12px; letter-spacing: 1.6px; color: #ffffff;">APPS</div>
    <div style="font-size: 12px; letter-spacing: 1.6px; color: #444444;">NOTES</div>
    <div style="font-size: 12px; letter-spacing: 1.6px; color: #444444;">TO-DO</div>
    <div style="font-size: 12px; letter-spacing: 1.6px; color: #444444;">STATS</div>
  </div>

  <!-- app list -->
  <div style="display: flex; flex-direction: column;">
    <div style="padding: 16px 24px; font-size: 19px; color: #ffffff;">Calendar</div>
    <div style="padding: 16px 24px; font-size: 19px; color: #ffffff;">Camera</div>
    <div style="padding: 16px 24px; font-size: 19px; color: #ffffff;">Clock</div>
    <div style="padding: 16px 24px; font-size: 19px; color: #ffffff;">Files</div>
    <div style="padding: 16px 24px; font-size: 19px; color: #ffffff;">Maps</div>
    <div style="padding: 16px 24px; font-size: 19px; color: #ffffff;">Messages</div>
    <div style="padding: 16px 24px; font-size: 19px; color: #ffffff;">Phone</div>
  </div>

</div>
</x-dc>
</body>
</html>
